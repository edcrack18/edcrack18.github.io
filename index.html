<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Redes Sociales</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #4e54c8, #8f94fb);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .username {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #ccc;
    }

    .social-links a {
      display: inline-block;
      margin: 10px;
      text-decoration: none;
      color: white;
      background: #222;
      padding: 10px 20px;
      border-radius: 10px;
      transition: background 0.3s;
    }

    .social-links a:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mi Nombre</h1>
    <div class="username">@mi_usuario</div>
    <div class="social-links">
      <a href="https://github.com/miusuario" target="_blank">GitHub</a>
      <a href="https://twitter.com/miusuario" target="_blank">Twitter</a>
      <a href="https://instagram.com/miusuario" target="_blank">Instagram</a>
      <a href="https://facebook.com/miusuario" target="_blank">Facebook</a>
    </div>
  </div>
</body>
</html>
